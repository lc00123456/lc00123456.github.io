<!DOCTYPE html>
<html>
<head>
    <title>跳转中...</title>
    <meta http-equiv="refresh" content="0;url={TARGET_URL}">
    <script>
        // 定义不同路径对应的跳转地址
        const urlMap = {
            // 格式："访问的路径": "目标跳转地址"
            "link1": "https://lpx.promzones.com/f/xuanfeng_22",
            "link2": "https://你的第二个网盘链接",
            "link3": "https://你的第三个推广链接",
            // 可以无限加，比如 link4、link5...
        };

        // 获取当前访问的路径
        const path = window.location.pathname.replace("/", "").split("_")[0];
        // 匹配路径，找不到就跳默认地址
        const targetUrl = urlMap[path] || "https://www.baidu.com"; // 默认兜底
        
        // 替换meta标签的跳转地址，执行跳转
        document.querySelector("meta[http-equiv='refresh']").content = `0;url=${targetUrl}`;
    </script>
</head>
<body>
    正在跳转...
</body>
</html>
